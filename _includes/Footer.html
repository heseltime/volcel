<div class="footer">
  <div class="footer-actions">
    <button class="torte-open" type="button" aria-haspopup="dialog" aria-label="Torte view: the whole lattice at once" title="Torte view">
      <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M7.5 4.2 19.8 16.5M4.2 7.5l12.3 12.3M16.5 4.2 4.2 16.5M19.8 7.5 7.5 19.8"/></svg>
    </button>
    <button class="theme-toggle" type="button" aria-label="Switch to dark mode" title="Switch to dark mode">
      <svg class="icon-moon" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z"/></svg>
      <svg class="icon-sun" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
    </button>
  </div>
  <div class="footer-left">
    <h6>
      © <span id="year"></span> {{ site.footer.copyright }} 
      {%- if site.footer.credits.enabled -%}
          • <a href="{{ site.baseurl }}{{ site.footer.credits.url }}"> {{ site.footer.credits.text }}</a>
      {%- endif -%}
    </h6>
  </div>
  <script>
      document.getElementById("year").innerHTML = new Date().getFullYear();
  </script>
</div>
